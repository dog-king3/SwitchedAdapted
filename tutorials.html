<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutorials | Switch on the Joy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="Switch on the Joy home">
        <span class="brand-mark">S</span>
        <span class="brand-name">Switch on the Joy</span>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        Menu
      </button>

      <nav class="main-nav" id="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="event.html">Last Year's Event</a>
        <a href="donate.html">Donations</a>
        <a href="tutorials.html" class="is-current">Tutorials</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container hero-layout">
        <div class="hero-copy">
          <h1>Tutorials</h1>
        </div>
      </div>
    </section>

    <section class="page-shell">
      <div class="container">
        <div class="tutorial-grid" aria-label="Tutorial placeholders">
          <article class="tutorial-card tutorial-placeholder" aria-label="Tutorial placeholder 1"></article>
          <article class="tutorial-card tutorial-placeholder" aria-label="Tutorial placeholder 2"></article>
          <article class="tutorial-card tutorial-placeholder" aria-label="Tutorial placeholder 3"></article>
          <article class="tutorial-card tutorial-placeholder" aria-label="Tutorial placeholder 4"></article>
          <article class="tutorial-card tutorial-placeholder" aria-label="Tutorial placeholder 5"></article>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-layout">
      <p class="footer-message">Switch on the Joy — Making toys more accessible for every child</p>
      <div class="footer-collaborators">
        <span class="collaborators-label">Our collaborators:</span>
        <div class="footer-logos" aria-label="Collaborator logos">
          <a class="footer-logo" href="https://fbnf.github.io/Team-Site/index.html" aria-label="FBNF website"><img src="images/fbnflogo.svg" alt="FBNF" onerror="this.remove()"></a>
          <span class="footer-logo"><img src="images/acelogo.svg" alt="ACE" onerror="this.remove()"></span>
          <span class="footer-logo"><img src="images/universitylogo.svg" alt="University" onerror="this.remove()"></span>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const navToggle = document.querySelector('.nav-toggle');
    const mainNav = document.querySelector('.main-nav');

    if (navToggle && mainNav) {
      navToggle.addEventListener('click', () => {
        const isOpen = mainNav.classList.toggle('is-open');
        navToggle.setAttribute('aria-expanded', String(isOpen));
      });
    }
  </script>
</body>
</html>
